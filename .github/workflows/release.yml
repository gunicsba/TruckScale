name: Release

# Push a tag like v1.0.0 to build all packages and publish a GitHub Release:
#   git tag v1.0.0 && git push origin v1.0.0
# "Run workflow" (manual) builds the same packages as downloadable artifacts, without a release.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Test
        run: dotnet test TruckScale.slnx -c Release
      - name: Publish program (win-x64)
        run: dotnet publish src/TruckScale.App -c Release -r win-x64 --self-contained true -p:Version=${{ needs.version.outputs.version }} -o out/TruckScale
      - name: Publish importer for the old DATA.LIS (win-x86, bundled in import)
        run: dotnet publish tools/TruckScale.Import -c Release -r win-x86 --self-contained true -p:Version=${{ needs.version.outputs.version }} -o out/TruckScale/import
      - name: Package
        shell: pwsh
        run: |
          $v = "${{ needs.version.outputs.version }}"
          Copy-Item README.md out/TruckScale/
          Copy-Item docs/FELHASZNALOI_UTMUTATO.md out/TruckScale/
          Compress-Archive -Path out/TruckScale/* -DestinationPath "TruckScale-$v-win-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: '*.zip'

  unix:
    needs: version
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rid: [linux-x64, osx-arm64, osx-x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish (${{ matrix.rid }})
        run: dotnet publish src/TruckScale.App -c Release -r ${{ matrix.rid }} --self-contained true -p:Version=${{ needs.version.outputs.version }} -o out/TruckScale
      - name: Package
        run: |
          cp README.md docs/FELHASZNALOI_UTMUTATO.md out/TruckScale/
          chmod +x out/TruckScale/TruckScale
          tar -czf "TruckScale-${{ needs.version.outputs.version }}-${{ matrix.rid }}.tar.gz" -C out TruckScale
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.rid }}
          path: '*.tar.gz'

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, windows, unix]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: Truck Scale ${{ needs.version.outputs.version }}
          generate_release_notes: true
          files: dist/*
          body: |
            ## Letöltés / Download
            | Rendszer | Fájl |
            |---|---|
            | **Windows** (ajánlott) | `TruckScale-${{ needs.version.outputs.version }}-win-x64.zip` |
            | Linux | `TruckScale-${{ needs.version.outputs.version }}-linux-x64.tar.gz` |
            | macOS (Apple Silicon / Intel) | `…-osx-arm64.tar.gz` / `…-osx-x64.tar.gz` |

            A régi program (TS.exe) beállításai és adatai: **Beállítás → Átvétel a régi programból** (Windows).

            Kicsomagolás után a `TruckScale.exe` (Linux/macOS: `TruckScale`) indítja a programot; telepíteni nem kell.
            Útmutató: [docs/FELHASZNALOI_UTMUTATO.md](https://github.com/${{ github.repository }}/blob/main/docs/FELHASZNALOI_UTMUTATO.md)
